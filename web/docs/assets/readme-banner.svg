<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Hiciarz — skaner kart i kreator talii</title>
  <desc id="desc">Nazwa Hiciarz i trzy kwadratowe karty ułożone w wachlarz, w proporcji 1:1 jak karty do druku 60 × 60 mm: Dancing Queen, ABBA, 1976; Last Christmas, Wham!, 1984; Take on Me, a-ha, 1985.</desc>
  <rect width="1200" height="360" rx="20" fill="#083b34"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="158" fill="#faf7ed" font-size="78" font-weight="700" letter-spacing="-3">hiciarz</text>
    <text x="58" y="205" fill="#d7e0d7" font-size="21">Skanowanie QR i tworzenie talii do druku.</text>
    <g transform="translate(672 108) rotate(-15 82 82)">
      <rect width="164" height="164" rx="12" fill="#d5dfcf"/>
      <rect x="7" y="7" width="150" height="150" rx="8" fill="none" stroke="#8da58d"/>
      <text x="16" y="29" fill="#315849" font-size="9" letter-spacing="1.6">HICIARZ</text>
      <text x="82" y="84" text-anchor="middle" fill="#234136" font-size="39" font-weight="700" letter-spacing="-1.5">1976</text>
      <text x="82" y="118" text-anchor="middle" fill="#234136" font-size="14" font-weight="700">Dancing Queen</text>
      <text x="82" y="141" text-anchor="middle" fill="#315849" font-size="12">ABBA</text>
    </g>
    <g transform="translate(816 76)">
      <rect width="164" height="164" rx="12" fill="#f1dab1"/>
      <rect x="7" y="7" width="150" height="150" rx="8" fill="none" stroke="#c2a779"/>
      <text x="16" y="29" fill="#6a4b27" font-size="9" letter-spacing="1.6">HICIARZ</text>
      <text x="82" y="84" text-anchor="middle" fill="#513b24" font-size="39" font-weight="700" letter-spacing="-1.5">1984</text>
      <text x="82" y="118" text-anchor="middle" fill="#513b24" font-size="14" font-weight="700">Last Christmas</text>
      <text x="82" y="141" text-anchor="middle" fill="#6a4b27" font-size="12">Wham!</text>
    </g>
    <g transform="translate(954 108) rotate(15 82 82)">
      <rect width="164" height="164" rx="12" fill="#ddd0e9"/>
      <rect x="7" y="7" width="150" height="150" rx="8" fill="none" stroke="#ac99bd"/>
      <text x="16" y="29" fill="#675576" font-size="9" letter-spacing="1.6">HICIARZ</text>
      <text x="82" y="84" text-anchor="middle" fill="#574763" font-size="39" font-weight="700" letter-spacing="-1.5">1985</text>
      <text x="82" y="118" text-anchor="middle" fill="#574763" font-size="14" font-weight="700">Take on Me</text>
      <text x="82" y="141" text-anchor="middle" fill="#675576" font-size="12">a-ha</text>
    </g>
  </g>
</svg>
