name: Publish Android beta
run-name: Android internal beta · ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'preview' || 'publish' }}

on:
  workflow_run:
    workflows: ['Check web and Android']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Podgląd bez dostępu do Google Play, podpisywania i budowania'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: android-releases
  queue: max
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    name: Plan Play beta without build execution
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: google-play-internal
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PLAY_BETA_ENABLED: ${{ vars.PLAY_BETA_ENABLED }}
      PLAY_VERSION_CODE_FLOOR: ${{ vars.PLAY_VERSION_CODE_FLOOR }}
      PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      plan_artifact_id: ${{ steps.plan_artifact.outputs.artifact-id }}
      plan_artifact_digest: ${{ steps.plan_artifact.outputs.artifact-digest }}
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - name: Select beta mode
        id: mode
        env:
          MANUAL_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL_PREVIEW" == true ]]; then
            printf 'active=true\ndry_run=true\n' >> "$GITHUB_OUTPUT"
          elif [[ "$PLAY_BETA_ENABLED" == true ]]; then
            printf 'active=true\ndry_run=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'active=false\ndry_run=false\n' >> "$GITHUB_OUTPUT"
            printf '### Google Play beta skipped\n\nSet PLAY_BETA_ENABLED=true after the first internal release is configured.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.active == 'true'
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Preview without Play access
        if: steps.mode.outputs.active == 'true' && steps.mode.outputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android_beta.py preview --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - name: Verify checked main source and required configuration
        if: steps.mode.outputs.active == 'true' && steps.mode.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: python3 .github/scripts/android_beta.py check-source
      - name: Obtain short-lived access to plan the release
        if: steps.mode.outputs.active == 'true' && steps.mode.outputs.dry_run == 'false'
        id: plan_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Prepare live version plan
        if: steps.mode.outputs.active == 'true' && steps.mode.outputs.dry_run == 'false'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.plan_auth.outputs.access_token }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: python3 .github/scripts/android_beta.py prepare --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - name: Hand off the public release plan
        if: steps.version.outputs.publish == 'true'
        id: plan_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-play-beta-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hiciarz-play-beta/RELEASE-PLAN.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build AAB without Play access or signing keys
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # This environment holds only client configuration that is packaged in the AAB.
    environment: google-play-internal-build
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      PLAY_BETA_ENABLED: 'true'
    outputs:
      bundle_artifact_id: ${{ steps.bundle_artifact.outputs.artifact-id }}
      bundle_artifact_digest: ${{ steps.bundle_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify the exact same-run release plan
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_ID: ${{ needs.plan.outputs.plan_artifact_id }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
        run: python3 .github/scripts/android_beta.py receive-plan --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - name: Match the public client configuration and release plan
        env:
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: python3 .github/scripts/android_beta.py check-build-config --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - name: Test Android release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_android*.py' -v
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test, lint and build unsigned AAB
        working-directory: android-app
        env:
          HICIARZ_UNSIGNED_RELEASE: 'true'
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          BETA_VERSION: ${{ needs.plan.outputs.version_name }}
          BETA_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :app:testDebugUnitTest :app:lintRelease :app:bundleRelease \
            -PversionName="$BETA_VERSION" -PversionCode="$BETA_VERSION_CODE"
      - name: Verify and stage only the unsigned AAB
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(android-app/app/build/outputs/bundle/release/*.aab)
          if (( ${#bundles[@]} != 1 )); then
            echo 'Expected one unsigned AAB from Gradle.' >&2
            exit 1
          fi
          python3 .github/scripts/android_beta.py stage-bundle --output-dir "$RUNNER_TEMP/hiciarz-play-beta" \
            --bundle "${bundles[0]}" --mapping android-app/app/build/outputs/mapping/release/mapping.txt
      - name: Hand off the unsigned AAB
        id: bundle_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-play-beta-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hiciarz-play-beta/unsigned.aab
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish to Play internal
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: google-play-internal
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PLAY_BETA_ENABLED: ${{ vars.PLAY_BETA_ENABLED }}
      PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify the exact same-run release plan
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_ID: ${{ needs.plan.outputs.plan_artifact_id }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan_artifact_digest }}
        run: python3 .github/scripts/android_beta.py receive-plan --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - name: Verify the exact same-run unsigned AAB
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_ID: ${{ needs.build.outputs.bundle_artifact_id }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.build.outputs.bundle_artifact_digest }}
        run: python3 .github/scripts/android_beta.py receive-bundle --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - name: Recheck release source and configuration before signing
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          python3 .github/scripts/android_beta.py check-source
          python3 .github/scripts/android_beta.py check-build-config --output-dir "$RUNNER_TEMP/hiciarz-play-beta"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Sign the AAB with the Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" || -z "$PLAY_UPLOAD_KEYSTORE_PASSWORD" ||
                ! "$PLAY_UPLOAD_KEY_ALIAS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || -z "$PLAY_UPLOAD_KEY_PASSWORD" ]]; then
            echo 'Configure all four PLAY_UPLOAD signing secrets.' >&2
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/hiciarz-play-upload.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key"
          directory="$RUNNER_TEMP/hiciarz-play-beta"
          if ! jarsigner -keystore "$key" -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD \
              -keypass:env PLAY_UPLOAD_KEY_PASSWORD -signedjar "$directory/signed.aab" \
              "$directory/unsigned.aab" "$PLAY_UPLOAD_KEY_ALIAS" > "$directory/signing.log" 2>&1; then
            echo 'The Play upload key could not sign the AAB.' >&2
            exit 1
          fi
      - name: Verify the AAB signature and upload certificate
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/hiciarz-play-beta"
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$directory/signed.aab" > "$directory/verification.log"
          if ! grep -Fxq 'jar verified.' "$directory/verification.log"; then
            echo 'The AAB JAR signature could not be verified.' >&2
            exit 1
          fi
          keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$directory/signed.aab" |
            python3 .github/scripts/android_beta.py verify-certificate
      - name: Obtain short-lived Play access after signing
        id: upload_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and commit to internal testing
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_ACCESS_TOKEN: ${{ steps.upload_auth.outputs.access_token }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          directory="$RUNNER_TEMP/hiciarz-play-beta"
          python3 .github/scripts/android_beta.py publish --output-dir "$directory" --bundle "$directory/signed.aab"
      - name: Retain the Play receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-play-beta-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hiciarz-play-beta/PLAY-RECEIPT.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing and bundle files
        if: always()
        run: |
          directory="$RUNNER_TEMP/hiciarz-play-beta"
          rm -f "$RUNNER_TEMP/hiciarz-play-upload.jks" "$directory/unsigned.aab" "$directory/signed.aab" \
            "$directory/signing.log" "$directory/verification.log"
