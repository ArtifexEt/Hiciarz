name: Check web and Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Android release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release versioning and notes
        run: python3 -m unittest discover -s .github/scripts -p 'test_android_release.py' -v
      - name: Validate Android changelog
        run: python3 .github/scripts/android_release.py --check-changelog

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.sha }}

  android:
    name: Android tests, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    env:
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID || secrets.SPOTIFY_CLIENT_ID }}
      HICIARZ_KEYSTORE_BASE64: ${{ secrets.HICIARZ_KEYSTORE_BASE64 }}
      HICIARZ_KEYSTORE_PASSWORD: ${{ secrets.HICIARZ_KEYSTORE_PASSWORD }}
      HICIARZ_KEY_ALIAS: ${{ secrets.HICIARZ_KEY_ALIAS }}
      HICIARZ_KEY_PASSWORD: ${{ secrets.HICIARZ_KEY_PASSWORD }}
      HICIARZ_PRODUCTION_SIGNING: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare private test signing when available
        run: |
          set -euo pipefail
          if [[ -n "$HICIARZ_KEYSTORE_BASE64" ]]; then
            if [[ -z "$HICIARZ_KEYSTORE_PASSWORD" || -z "$HICIARZ_KEY_ALIAS" || -z "$HICIARZ_KEY_PASSWORD" ]]; then
              echo 'The private signing secrets are incomplete.' >&2
              exit 1
            fi
            signing_file="$RUNNER_TEMP/hiciarz-signing.jks"
            umask 077
            printf '%s' "$HICIARZ_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
            echo "HICIARZ_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"
          else
            echo 'Private signing is unavailable; this CI build uses an ephemeral Android debug key.'
          fi
      - name: Test, lint and build test-signed release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify that the CI APK is signed
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          if ! "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"; then
            rm -f "$apk"
            exit 1
          fi
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-build-${{ github.run_number }}
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hiciarz-signing.jks"

  android-ui:
    name: Offline Android UI and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install compile platform and enable emulator acceleration
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          sudo chmod a+rw /dev/kvm
      - name: Prepare offline UI test and screenshot collection
        run: |
          cat > "$RUNNER_TEMP/hiciarz-ui-test.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci-screenshots
          collect_screenshots() {
            adb exec-out run-as pl.artifex.hiciarz tar -C files -cf - screenshots \
              | tar -xf - -C ci-screenshots || true
          }
          trap collect_screenshots EXIT
          adb shell svc wifi disable
          adb shell svc data disable
          ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true \
            -Pandroid.testInstrumentationRunnerArguments.package=pl.artifex.hiciarz
          SCRIPT
      - name: Run native flow on AOSP without a Spotify account
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android-app
          script: bash "$RUNNER_TEMP/hiciarz-ui-test.sh"
      - name: Upload native screenshots and instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-ui-${{ github.run_number }}
          path: |
            android-app/ci-screenshots/
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
