name: Publish Android test release
run-name: Android ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'changelog' }} · ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'preview' || 'publish' }}

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja z CHANGELOG.md; puste pole wybiera pierwszy wpis wersjonowany'
        required: false
        type: string
      version_code:
        description: 'Opcjonalny versionCode, większy od wszystkich opublikowanych buildów'
        required: false
        type: string
      dry_run:
        description: 'Tylko podgląd opisu i wersji, bez budowania APK i publikacji'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-releases
  queue: max
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Android release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      HICIARZ_PRODUCTION_SIGNING: 'false'
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test release tooling
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts -p 'test_android_release.py' -v
      - name: Prepare version and changelog notes
        id: version
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            printf 'Tryb: publikacja APK\n\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Tryb: podgląd, bez budowania APK i publikacji\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 .github/scripts/android_release.py \
            --version "$INPUT_VERSION" --version-code "$INPUT_VERSION_CODE" \
            --output-dir android-app/release-artifacts
          printf 'publish=%s\n' "$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.version.outputs.publish == 'true'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.version.outputs.publish == 'true'
      - name: Install Android platform
        if: steps.version.outputs.publish == 'true'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare private test signing
        if: steps.version.outputs.publish == 'true'
        env:
          HICIARZ_KEYSTORE_BASE64: ${{ secrets.HICIARZ_KEYSTORE_BASE64 }}
          HICIARZ_KEYSTORE_PASSWORD: ${{ secrets.HICIARZ_KEYSTORE_PASSWORD }}
          HICIARZ_KEY_ALIAS: ${{ secrets.HICIARZ_KEY_ALIAS }}
          HICIARZ_KEY_PASSWORD: ${{ secrets.HICIARZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$HICIARZ_KEYSTORE_BASE64" || -z "$HICIARZ_KEYSTORE_PASSWORD" || \
                -z "$HICIARZ_KEY_ALIAS" || -z "$HICIARZ_KEY_PASSWORD" ]]; then
            echo 'Configure all four HICIARZ signing secrets before publishing an APK.' >&2
            exit 1
          fi
          certificate_digest="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$certificate_digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Configure the public ANDROID_SIGNING_CERT_SHA256 repository variable.' >&2
            exit 1
          fi
          signing_file="$RUNNER_TEMP/hiciarz-signing.jks"
          umask 077
          printf '%s' "$HICIARZ_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          echo "HICIARZ_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"
      - name: Test, lint and build
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          HICIARZ_KEYSTORE_PASSWORD: ${{ secrets.HICIARZ_KEYSTORE_PASSWORD }}
          HICIARZ_KEY_ALIAS: ${{ secrets.HICIARZ_KEY_ALIAS }}
          HICIARZ_KEY_PASSWORD: ${{ secrets.HICIARZ_KEY_PASSWORD }}
        run: |
          if [[ ! "$SPOTIFY_CLIENT_ID" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo 'Set the SPOTIFY_CLIENT_ID Actions secret before publishing an APK.' >&2
            exit 1
          fi
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PversionName="$RELEASE_VERSION" -PversionCode="$RELEASE_VERSION_CODE"
      - name: Prepare APK, checksum and certificate
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          apk_name="hiciarz-android-${RELEASE_VERSION}-test.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/$apk_name"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          badging="$("$build_tools/aapt2" dump badging "release-artifacts/$apk_name")"
          if [[ "$badging" != *"package: name='pl.artifex.hiciarz'"* ]] || \
             [[ "$badging" != *"versionCode='$RELEASE_VERSION_CODE'"* ]] || \
             [[ "$badging" != *"versionName='$RELEASE_VERSION'"* ]]; then
            echo 'Built APK package or version does not match the requested release.' >&2
            exit 1
          fi
          "$build_tools/apksigner" verify --verbose --print-certs "release-artifacts/$apk_name" > release-artifacts/SIGNING-CERTIFICATE.txt
          expected_test_cert="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if ! grep --fixed-strings --ignore-case --quiet \
            "certificate SHA-256 digest: $expected_test_cert" release-artifacts/SIGNING-CERTIFICATE.txt; then
            echo 'The APK signing certificate does not match ANDROID_SIGNING_CERT_SHA256.' >&2
            exit 1
          fi
          {
            printf 'applicationId=pl.artifex.hiciarz\nversionName=%s\nversionCode=%s\n' "$RELEASE_VERSION" "$RELEASE_VERSION_CODE"
            printf 'commit=%s\nsigning=test\n' "$GITHUB_SHA"
            printf 'previousTag=%s\n' "$PREVIOUS_TAG"
          } > release-artifacts/BUILD-INFO.txt
          cd release-artifacts
          sha256sum "$apk_name" > "$apk_name.sha256"
      - name: Keep release preview and files as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-${{ steps.version.outputs.name }}
          path: android-app/release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish prerelease
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-artifacts/*.apk release-artifacts/*.sha256 \
            release-artifacts/SIGNING-CERTIFICATE.txt release-artifacts/BUILD-INFO.txt \
            --repo "$REPOSITORY" --target "$GITHUB_SHA" \
            --title "Hiciarz Android ${RELEASE_VERSION} — test" \
            --notes-file release-artifacts/RELEASE-NOTES.md --prerelease --latest=false
      - name: Remove temporary private keystore
        if: always() && steps.version.outputs.publish == 'true'
        run: rm -f "$RUNNER_TEMP/hiciarz-signing.jks"
