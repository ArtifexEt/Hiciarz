name: Publish Android test release

# Retired: automatic betas use android-firebase-beta.yml after trusted main CI.
# Keep a credential-free notice at the old workflow path; tags no longer publish.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Legacy APK publishing is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the current beta channel
        run: |
          printf '%s\n' 'Legacy tag/manual APK publishing is disabled.'
          printf '%s\n' 'Betas are published by android-firebase-beta.yml after successful main CI.'
